[project]
name = "api"
version = "0.1.0"
description = "FastAPI gateway service"
readme = "README.md"
authors = [
    { name = "copilot-swe-agent[bot]", email = "198982749+Copilot@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.118.0",
    "pydantic>=2.11.9",
    "redis>=6.4.0",
    "uvicorn>=0.37.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
