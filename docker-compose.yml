services:
  redis:
    image: redis:8
    ports:
      - "6379:6379"

  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: >
      sh -c "pip install --no-cache-dir uv &&
      uv run --package api uvicorn api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: >
      sh -c "pip install --no-cache-dir uv &&
      uv run --package worker worker"
    depends_on:
      - redis

  web:
    image: node:24-alpine
    working_dir: /workspace/apps/web
    volumes:
      - ./:/workspace
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - api

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
