name: agent-platform

services:
  redis:
    image: redis:8@sha256:718f745deb7dfefeac6eed7041fc7ec9476b50e61b247932682457c41adafa0e
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: api
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["worker"]
    depends_on:
      - redis

  web:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    working_dir: /workspace/apps/web
    volumes:
      - ./:/workspace
    environment:
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    command: >
      sh -c "corepack pnpm install --frozen-lockfile &&
      corepack pnpm dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - api

  jaeger:
    image: jaegertracing/all-in-one:1.68.0@sha256:6279882637ae03e70f519965d2ba5ca84cb785f4baf4f0d7237e827a37c33a42
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
