[project]
name = "multi-tenant-agent-platform-telemetry-console"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "api",
    "worker",
    "sandbox",
    "contracts",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "apps/sandbox",
    "packages/contracts",
]

[tool.uv.sources]
api = { workspace = true }
worker = { workspace = true }
sandbox = { workspace = true }
contracts = { workspace = true }

[tool.ruff.lint]
# EXE002 false-positives on Docker bind mounts over Windows volumes, which
# report every file as executable regardless of the real git mode bits.
ignore = ["EXE002"]
